<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 동물 전쟁</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: 'Pretendard', sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive {
            pointer-events: auto;
        }
        /* Lobby UI */
        #lobby-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ffffff33;
            border-radius: 16px;
            padding: 30px;
            color: #ffffff;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        #lobby-modal h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        #lobby-status {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.ready {
            background: #16a34a;
        }
        /* Countdown Overlay */
        #countdown-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: none;
        }
        /* In-Game HUD */
        #hud {
            display: none;
            width: 100%;
            padding: 15px 20px;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }
        .nexus-hp-bar {
            width: 40%;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }
        #p1-hp { background: #ef4444; }
        #p2-hp { background: #3b82f6; }
        
        /* Mobile Controls: 기본적으로 숨김 처리 */
        #mobile-controls {
            display: none;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        /* 게임이 시작된 후 active 클래스가 추가되면 화면 크기 조건에 따라 표시 */
        @media (max-width: 768px) {
            #mobile-controls.active {
                display: block;
            }
        }
        #spawn-btn {
            width: 100%;
            max-width: 300px;
            height: 60px;
            font-size: 20px;
            background: #dc2626;
            border-radius: 30px;
            box-shadow: 0 6px 0 #991b1b;
        }
        #spawn-btn:active {
            box-shadow: 0 2px 0 #991b1b;
            transform: translateY(4px);
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="ui-layer">
        <div id="hud">
            <div style="width: 45%;">
                <div style="color: #ef4444; font-weight: bold; margin-bottom: 4px;">P1 NEXUS</div>
                <div class="nexus-hp-bar"><div id="p1-hp" class="hp-fill"></div></div>
            </div>
            <div style="color: white; font-weight: bold; font-size: 20px;">VS</div>
            <div style="width: 45%; text-align: right;">
                <div style="color: #3b82f6; font-weight: bold; margin-bottom: 4px;">P2 NEXUS</div>
                <div class="nexus-hp-bar"><div id="p2-hp" class="hp-fill"></div></div>
            </div>
        </div>

        <div id="countdown-overlay">3</div>

        <div id="lobby-modal" class="interactive">
            <h1 id="lobby-title">로비 대기실</h1>
            <p id="lobby-status">상대 플레이어를 기다리는 중...</p>
            <button id="ready-btn" class="btn">준비</button>
        </div>

        <div id="mobile-controls" class="interactive">
            <button id="spawn-btn" class="btn">동물 소환 (SPACE)</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myPlayerNum = null;
        let isGameStarted = false;

        const FIELD_WIDTH = 100;
        const FIELD_DEPTH = 10;
        const MID_LINE_Z = 5;

        let scene, camera, renderer;
        let p1Nexus, p2Nexus;
        const NEXUS_MAX_HP = 1000;
        let p1NexusHp = NEXUS_MAX_HP;
        let p2NexusHp = NEXUS_MAX_HP;

        const units = [];

        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 50, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const groundGeo = new THREE.PlaneGeometry(FIELD_WIDTH, FIELD_DEPTH);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, 0, MID_LINE_Z);
            ground.receiveShadow = true;
            scene.add(ground);

            const lineGeo = new THREE.PlaneGeometry(0.6, FIELD_DEPTH);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.01, MID_LINE_Z);
            scene.add(line);

            const midGuideGeo = new THREE.PlaneGeometry(FIELD_WIDTH, 0.1);
            const midGuideMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            const midGuide = new THREE.Mesh(midGuideGeo, midGuideMat);
            midGuide.rotation.x = -Math.PI / 2;
            midGuide.position.set(0, 0.01, MID_LINE_Z);
            scene.add(midGuide);

            const nexusGeo = new THREE.BoxGeometry(4, 8, 8);
            const p1Mat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const p2Mat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

            p1Nexus = new THREE.Mesh(nexusGeo, p1Mat);
            p1Nexus.position.set(-FIELD_WIDTH / 2 + 2, 4, MID_LINE_Z);
            p1Nexus.castShadow = true;
            scene.add(p1Nexus);

            p2Nexus = new THREE.Mesh(nexusGeo, p2Mat);
            p2Nexus.position.set(FIELD_WIDTH / 2 - 2, 4, MID_LINE_Z);
            p2Nexus.castShadow = true;
            scene.add(p2Nexus);

            camera.position.set(0, 45, 45);
            camera.lookAt(0, 0, MID_LINE_Z);

            window.addEventListener('resize', onWindowResize);
        }

        function adjustCameraForPlayer() {
            if (myPlayerNum === 1) {
                camera.position.set(-25, 40, 40);
            } else if (myPlayerNum === 2) {
                camera.position.set(25, 40, 40);
            } else {
                camera.position.set(0, 45, 45);
            }
            camera.lookAt(0, 0, MID_LINE_Z);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createAnimalMesh(stats) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(stats.scale, stats.scale, stats.scale);
            const bodyMat = new THREE.MeshStandardMaterial({ color: stats.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = stats.scale / 2;
            body.castShadow = true;
            group.add(body);

            const dotGeo = new THREE.SphereGeometry(stats.scale * 0.2);
            const dotMat = new THREE.MeshBasicMaterial({ color: stats.isRanged ? 0xffff00 : 0xff0000 });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.y = stats.scale + 0.5;
            group.add(dot);

            return group;
        }

        function spawnAnimal(data) {
            const { id, owner, stats } = data;
            const mesh = createAnimalMesh(stats);
            
            const spawnX = owner === 1 ? -FIELD_WIDTH / 2 + 5 : FIELD_WIDTH / 2 - 5;
            const spawnZ = Math.random() * FIELD_DEPTH;
            mesh.position.set(spawnX, 0, spawnZ);
            scene.add(mesh);

            units.push({
                id,
                owner,
                stats,
                mesh,
                currentHp: stats.hp,
                maxHp: stats.hp,
                lastAttack: 0
            });
        }

        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (isGameStarted) {
                updateGameLogic(currentTime, dt);
            }

            renderer.render(scene, camera);
        }

        function updateGameLogic(currentTime, dt) {
            for (let i = units.length - 1; i >= 0; i--) {
                const u = units[i];
                if (u.currentHp <= 0) continue;

                let target = null;
                let minDist = Infinity;

                const enemyNexusPos = u.owner === 1 ? p2Nexus.position : p1Nexus.position;
                const distToNexus = u.mesh.position.distanceTo(enemyNexusPos);
                target = { position: enemyNexusPos, isNexus: true };
                minDist = distToNexus;

                for (let j = 0; j < units.length; j++) {
                    const enemy = units[j];
                    if (enemy.owner !== u.owner && enemy.currentHp > 0) {
                        const d = u.mesh.position.distanceTo(enemy.mesh.position);
                        if (d < minDist) {
                            minDist = d;
                            target = { position: enemy.mesh.position, isNexus: false, unit: enemy };
                        }
                    }
                }

                if (target) {
                    if (minDist <= u.stats.range) {
                        if (currentTime - u.lastAttack > 1000) {
                            u.lastAttack = currentTime;
                            if (target.isNexus) {
                                if (u.owner === 1) {
                                    p2NexusHp = Math.max(0, p2NexusHp - u.stats.atk);
                                } else {
                                    p1NexusHp = Math.max(0, p1NexusHp - u.stats.atk);
                                }
                                updateHUD();
                            } else {
                                target.unit.currentHp -= u.stats.atk;
                            }
                        }
                    } else {
                        let targetX = target.position.x;
                        let targetZ = target.position.z;

                        if (Math.abs(u.mesh.position.z - MID_LINE_Z) > 0.8) {
                            targetZ = MID_LINE_Z;
                        }

                        const moveDir = new THREE.Vector3(targetX - u.mesh.position.x, 0, targetZ - u.mesh.position.z).normalize();
                        u.mesh.position.addScaledVector(moveDir, u.stats.speed * dt);
                        u.mesh.lookAt(u.mesh.position.clone().add(moveDir));
                    }
                }
            }

            for (let i = units.length - 1; i >= 0; i--) {
                if (units[i].currentHp <= 0) {
                    scene.remove(units[i].mesh);
                    units.splice(i, 1);
                }
            }

            if (p1NexusHp <= 0 || p2NexusHp <= 0) {
                isGameStarted = false;
                document.getElementById('mobile-controls').classList.remove('active');
                const winner = p1NexusHp > 0 ? "Player 1" : "Player 2";
                alert(`게임 종료! ${winner} 승리!`);
                location.reload();
            }
        }

        function updateHUD() {
            document.getElementById('p1-hp').style.width = (p1NexusHp / NEXUS_MAX_HP * 100) + '%';
            document.getElementById('p2-hp').style.width = (p2NexusHp / NEXUS_MAX_HP * 100) + '%';
        }

        socket.emit('join_room');

        socket.on('assigned_player', (data) => {
            myPlayerNum = data.playerNum;
            document.getElementById('lobby-title').innerText = `플레이어 ${myPlayerNum} (방: ${data.roomId})`;
            adjustCameraForPlayer();
        });

        socket.on('room_status', (data) => {
            const statusEl = document.getElementById('lobby-status');
            const readyBtn = document.getElementById('ready-btn');
            
            if (data.count < 2) {
                statusEl.innerText = "다른 플레이어 접속 대기 중...";
                readyBtn.style.display = "none";
            } else {
                statusEl.innerText = "상대 플레이어 접속 완료! 준비를 눌러주세요.";
                readyBtn.style.display = "inline-block";
                
                const me = Object.values(data.players).find(p => p.num === myPlayerNum);
                if (me && me.ready) {
                    readyBtn.classList.add('ready');
                    readyBtn.innerText = "준비 완료!";
                } else {
                    readyBtn.classList.remove('ready');
                    readyBtn.innerText = "준비";
                }
            }
        });

        socket.on('countdown', (count) => {
            const overlay = document.getElementById('countdown-overlay');
            overlay.style.display = 'block';
            overlay.innerText = count;
        });

        socket.on('countdown_cancelled', () => {
            document.getElementById('countdown-overlay').style.display = 'none';
        });

        socket.on('game_start', () => {
            document.getElementById('lobby-modal').style.display = 'none';
            document.getElementById('countdown-overlay').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('mobile-controls').classList.add('active');
            isGameStarted = true;
        });

        socket.on('animal_spawned', (data) => {
            spawnAnimal(data);
        });

        socket.on('player_left', () => {
            alert("상대방이 게임을 나갔습니다.");
            location.reload();
        });

        const readyBtn = document.getElementById('ready-btn');
        readyBtn.addEventListener('click', () => {
            socket.emit('toggle_ready');
        });

        function triggerSpawn() {
            if (isGameStarted) {
                socket.emit('spawn_animal');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                triggerSpawn();
            }
        });

        document.getElementById('spawn-btn').addEventListener('click', () => {
            triggerSpawn();
        });

        init3D();
        animate(performance.now());
    </script>
</body>
</html>
